


name: Spring PetClinic CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test, SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw -B clean verify

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_TOKEN or SONAR_HOST_URL is missing."
            exit 1
          fi

          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Spring-PetClinic \
            -Dsonar.projectName=Spring-PetClinic \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-petclinic-jar
          path: |
            target/*.jar
            !target/*.original
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-petclinic-jar
          path: target

      - name: Configure SSH
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          if [ -z "$EC2_PRIVATE_KEY" ]; then
            echo "ERROR: EC2_PRIVATE_KEY secret is missing."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Verify deployment target
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing."
            exit 1
          fi

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "ubuntu@${EC2_HOST}" \
            'echo "SSH connection successful"'

      - name: Copy application JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No application JAR found."
            exit 1
          fi

          scp -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            "$JAR_FILE" \
            "ubuntu@${EC2_HOST}:/home/ubuntu/spring-petclinic.jar"

      - name: Install Java and restart PetClinic
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            -o IdentitiesOnly=yes \
            "ubuntu@${EC2_HOST}" \
            'set -e
             sudo apt-get update
             sudo apt-get install -y openjdk-17-jre-headless
             mkdir -p /home/ubuntu
             if [ -f /home/ubuntu/spring-petclinic.pid ]; then
               old_pid=$(cat /home/ubuntu/spring-petclinic.pid)
               if kill -0 "$old_pid" 2>/dev/null; then
                 kill "$old_pid"
                 for i in $(seq 1 15); do
                   kill -0 "$old_pid" 2>/dev/null || break
                   sleep 1
                 done
                 kill -0 "$old_pid" 2>/dev/null && kill -9 "$old_pid" || true
               fi
             fi
             nohup java -jar /home/ubuntu/spring-petclinic.jar \
               --server.port=8080 \
               > /home/ubuntu/spring-petclinic.log 2>&1 < /dev/null &
             echo $! > /home/ubuntu/spring-petclinic.pid
             sleep 5
             if ! kill -0 "$(cat /home/ubuntu/spring-petclinic.pid)" 2>/dev/null; then
               echo "ERROR: PetClinic failed to start."
               tail -n 50 /home/ubuntu/spring-petclinic.log
               exit 1
             fi
             echo "PetClinic deployment command completed."'

